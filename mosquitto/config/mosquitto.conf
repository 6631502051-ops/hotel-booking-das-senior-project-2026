# Mosquitto broker for the DAS digital door lock.
# Users and passwords are created at start-up by start.sh from .env.
per_listener_settings false
allow_anonymous false
password_file /mosquitto/data/passwd
acl_file /mosquitto/data/acl

persistence true
persistence_location /mosquitto/data/
log_dest stdout
log_type error
log_type warning
log_type notice
connection_messages true

# Plain MQTT: the Raspberry Pi on the local network (port bound in docker-compose.yml)
listener 1883
protocol mqtt

# MQTT over WebSockets: the keypad page and the Pi through the Cloudflare tunnel.
# Not published to the host; Apache forwards https://<site>/mqtt to here.
listener 9001
protocol websockets
