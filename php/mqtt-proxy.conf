# Forward MQTT-over-WebSockets from https://<site>/mqtt to the Mosquitto container.
# The keypad page and the Raspberry Pi can then use the same address as the website,
# including the Cloudflare tunnel, without publishing port 9001.
ProxyPass        "/mqtt" "ws://mqtt:9001/mqtt"
ProxyPassReverse "/mqtt" "ws://mqtt:9001/mqtt"
